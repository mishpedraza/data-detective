name: Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC: research links can break without any code change.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  gameplay:
    name: Gameplay (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload report, screenshots, videos and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  links:
    name: Research links (warnings only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # External sites can be slow or block bots, so this job reports but never blocks a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:links
      - name: Upload link report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: playwright-report/
          retention-days: 14
